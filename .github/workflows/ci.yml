name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create fixture docs
        shell: bash
        run: bash scripts/ci-fixture-docs.sh

      - uses: ./

      - name: Assert the site
        shell: bash
        run: |
          set -euo pipefail
          test -f _site/index.html
          test -f _site/404.html
          test -f _site/learn.html
          test -f _site/learn/deep.html
          test -f _site/.nojekyll
          grep -q "Hello from documaru CI" _site/index.html
