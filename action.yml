name: "documaru"
description: "Build a static documentation site from a folder of markdown files."
author: "Denshya"

inputs:
  path:
    description: "Path to the markdown docs folder, relative to the repository root."
    required: false
    default: "docs"
  title:
    description: "Site title shown in the top bar and in page titles. Defaults to the repository name."
    required: false
    default: ""
  description:
    description: "One sentence about the project, used for search engines and link previews. Defaults to the first paragraph of the home page."
    required: false
    default: ""
  logo:
    description: "Logo shown next to the title and used as the favicon: a path relative to the docs folder, or a URL."
    required: false
    default: ""
  accent-color:
    description: "Color of links and highlights, e.g. '#0f766e'."
    required: false
    default: ""
  base:
    description: "Base path the site is served from. Use '/<repository>/' for project pages (user.github.io/repository)."
    required: false
    default: "/"
  footer:
    description: "Text shown in the footer. Defaults to the site title."
    required: false
    default: ""
  repository:
    description: "GitHub repository ('owner/name') behind the GitHub and 'Edit this page' links. Set to an empty string to hide them."
    required: false
    default: "${{ github.repository }}"

outputs:
  path:
    description: "Path of the built site, relative to the repository root."
    value: "_site"

runs:
  using: "composite"
  steps:
    - name: "Setup bun"
      uses: "oven-sh/setup-bun@v2"
      with:
        bun-version: "1.3.14"

    - name: "Copy docs into the builder"
      shell: bash
      run: |
        set -euo pipefail

        SOURCE="$GITHUB_WORKSPACE/${{ inputs.path }}"
        DEST="$GITHUB_ACTION_PATH/docs"
        if [ ! -d "$SOURCE" ]; then
          echo "::error::documaru: docs path '${{ inputs.path }}' does not exist."
          exit 1
        fi

        if [ "$(realpath "$SOURCE")" != "$(realpath "$DEST")" ]; then
          rm -rf "$DEST"
          mkdir -p "$DEST"
          cp -R "$SOURCE"/. "$DEST/"
        fi

    - name: "Install dependencies"
      shell: bash
      run: |
        set -euo pipefail
        cd "$GITHUB_ACTION_PATH"
        bun install --frozen-lockfile

    - name: "Build and prerender the site"
      shell: bash
      env:
        DOCUMARU_TITLE: "${{ inputs.title }}"
        DOCUMARU_DESCRIPTION: "${{ inputs.description }}"
        DOCUMARU_LOGO: "${{ inputs.logo }}"
        DOCUMARU_ACCENT: "${{ inputs.accent-color }}"
        DOCUMARU_BASE: "${{ inputs.base }}"
        DOCUMARU_FOOTER: "${{ inputs.footer }}"
        DOCUMARU_REPO: "${{ inputs.repository }}"
        DOCUMARU_BRANCH: "${{ github.event.repository.default_branch }}"
        DOCUMARU_DOCS_PATH: "${{ inputs.path }}"
        # Where the pages come from: last-updated dates are read from its git history.
        DOCUMARU_SOURCE_DIR: "${{ github.workspace }}/${{ inputs.path }}"
      run: |
        set -euo pipefail
        cd "$GITHUB_ACTION_PATH"
        bun run build
        bun run build:ssg

    - name: "Emit the site"
      shell: bash
      run: |
        set -euo pipefail
        mkdir -p "$GITHUB_WORKSPACE/_site"
        cp -R "$GITHUB_ACTION_PATH/build"/. "$GITHUB_WORKSPACE/_site/"
